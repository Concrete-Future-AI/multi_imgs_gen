<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变背景 -->
  <defs>
    <linearGradient id="closeupGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="300" height="300" fill="url(#closeupGradient)"/>
  
  <!-- 产品展示台 -->
  <ellipse cx="150" cy="250" rx="80" ry="15" fill="#d1d5db" opacity="0.3"/>
  
  <!-- 示例产品轮廓 -->
  <rect x="100" y="120" width="100" height="120" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- 产品细节线条 -->
  <line x1="110" y1="140" x2="190" y2="140" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="110" y1="160" x2="170" y2="160" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="110" y1="180" x2="180" y2="180" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- 聚光灯效果 -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="url(#closeupGradient)" stroke-width="40" opacity="0.1"/>
  
  <!-- 标题文字 -->
  <text x="150" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151">产品特写</text>
  <text x="150" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Professional Close-up</text>
</svg>